<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Money Atlas</title>
<meta name="description" content="シンプルなお小遣い帳とサブスク管理。データは端末の中だけに保存されます。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Money Atlas">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="main" class="app" aria-live="polite"></main>

<nav class="tabbar" aria-label="メイン">
  <button data-action="tab" data-tab="today" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3.5" fill="currentColor"/><path d="M8 2.5v3M16 2.5v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="14" r="2.4" fill="var(--bg)"/></svg>Today</button>
  <button data-action="tab" data-tab="recurring">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 10a8 8 0 0 1 14-3.5"/><path d="M19.5 3v4h-4"/><path d="M19.5 14a8 8 0 0 1-14 3.5"/><path d="M4.5 21v-4h4"/></svg>Recurring</button>
  <button class="add" data-action="new" aria-label="支出を記録する">
    <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span></button>
  <button data-action="tab" data-tab="report">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4" y="12" width="4" height="9" rx="1.2"/><rect x="10" y="7" width="4" height="14" rx="1.2"/><rect x="16" y="3" width="4" height="18" rx="1.2"/></svg>Insights</button>
  <button data-action="tab" data-tab="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>Settings</button>
</nav>

<div id="backdrop" class="backdrop" hidden></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></div>

<input type="file" id="file-eb" accept=".csv,text/csv" hidden>
<input type="file" id="file-restore" accept=".json,application/json" hidden>

<noscript>Money Atlas を使うには JavaScript を有効にしてください。</noscript>
<script type="module" src="src/app.js"></script>
</body>
</html>
